name: CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tests/**'
      - 'tools/**'
      - 'pyproject.toml'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tests/**'
      - 'tools/**'
      - 'pyproject.toml'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege permissions. `security-events: write` is required so the CodeQL
# SARIF upload action can publish Trivy results to code scanning.
permissions:
  contents: read
  security-events: write

jobs:
  # ---------- Backend: lint, format, typecheck, tests ----------
  backend:
    name: Backend (lint/type/test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: paymentops
          POSTGRES_PASSWORD: paymentops
          POSTGRES_DB: paymentops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paymentops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://paymentops:paymentops@localhost:5432/paymentops_test
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_USER: paymentops
      DATABASE_PASSWORD: paymentops
      DATABASE_NAME: paymentops_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Mypy type check
        run: mypy

      - name: Run database migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Pytest (coverage)
        run: pytest --cov=paymentops_api --cov=payment_domain --cov=paymentops_worker --cov-report=term-missing -q

  # ---------- Frontend: lint, typecheck, build ----------
  frontend:
    name: Frontend (lint/type/build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # ---------- Security: secret + dependency scanning prep ----------
  security:
    name: Security (secret/dep scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan (detect leaked secrets)
        uses: trufflesecurity/trufflehog@v3.97.1
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --results=verified,unknown

      - name: Run Trivy filesystem vulnerability scan (prep)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: Trivy

  # ---------- Build & publish arm64 images to GHCR (private, immutable commit tags) ----------
  # The target cluster node is linux/arm64. Images are published under the repository owner's
  # GHCR namespace with the full commit SHA as an immutable tag.
  build:
    name: Build & publish arm64 images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Emulated arm64 builds (the runner is amd64; the cluster is arm64).
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/paymentops-hackathon-api:${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_started_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/paymentops-hackathon-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
