[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudnova-paymentops-backend"
version = "0.1.0"
description = "CloudNova PaymentOps - non-transactional payment-data intelligence platform (backend)"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "CloudNova" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    # Required by SQLAlchemy's asyncio extension on a fresh install; without it
    # `sqlalchemy.ext.asyncio` raises ImportError at import time.
    "greenlet>=3.1",
    "alembic>=1.14",
    "psycopg2-binary>=2.9",
    "asyncpg>=0.30",
    "celery>=5.4",
    "redis>=5.2",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "lxml>=5.3",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-redis>=4.6",
    "types-psycopg2>=2.9",
    "lxml-stubs>=0.5",
]

[tool.setuptools.packages.find]
where = ["packages", "apps/api", "apps/worker"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages", "apps", "tests"]
# Vendored upstream code is never linted/formatted/modified.
exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "TID"]
ignore = ["S101", "S311"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S", "B"]
"alembic/**/*" = ["S"]
# All-interface binding (S104) is intended for container endpoints; the placeholder
# default DB password (S105) is the documented fake value from .env.example.
"apps/api/paymentops_api/settings.py" = ["S104", "S105"]
"packages/payment_domain/models.py" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["paymentops_api", "paymentops_worker", "payment_domain"]
mypy_path = ["packages", "apps/api", "apps/worker"]
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "migrations/", "third_party/"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "billiard.*", "redis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers"
testpaths = ["tests", "apps/api/tests", "apps/worker/tests"]
# Include repo root so test modules can `from tests.conftest import ...`.
pythonpath = [".", "packages", "apps/api", "apps/worker"]
# Run `async def` tests without per-test markers (integration/security DB suites).
asyncio_mode = "auto"
# Strict on our own code, but ignore DeprecationWarnings emitted by third-party
# dependencies (anyio/starlette/fastapi) which are version-dependent and not actionable.
filterwarnings = [
    "ignore::DeprecationWarning:anyio",
    "ignore::DeprecationWarning:starlette",
    "ignore::DeprecationWarning:fastapi",
    "error::DeprecationWarning",
]

[tool.coverage.run]
source = ["paymentops_api", "payment_domain", "paymentops_worker"]
